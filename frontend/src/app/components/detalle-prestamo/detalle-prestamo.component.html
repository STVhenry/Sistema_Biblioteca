<div class="contenedor">
  <div class="encabezado-modulo">
    <h2>Gestión de Detalle de Préstamos</h2>
    <button type="button" class="boton-pdf" (click)="descargarPdf()">📄 Descargar PDF</button>
  </div>

  <div *ngIf="mensajeError" class="alerta-error">{{ mensajeError }}</div>

  <form class="formulario" (ngSubmit)="guardar()">
    <div class="campo">
      <label for="fechaDevolucion">Fecha de devolución</label>
      <input id="fechaDevolucion" type="date" [(ngModel)]="detallePrestamoActual.fechaDevolucion" name="fechaDevolucion">
      <small class="ayuda">Se llena cuando el ejemplar es devuelto</small>
    </div>
    <div class="campo">
      <label for="estado">Estado</label>
      <input id="estado" type="text" [(ngModel)]="detallePrestamoActual.estado" name="estado">
      <small class="ayuda">Ej. PRESTADO, DEVUELTO</small>
    </div>
    <div class="campo">
      <label for="prestamo">Préstamo</label>
      <select id="prestamo" [(ngModel)]="detallePrestamoActual.prestamo.id" name="prestamo">
        <option [value]="0" disabled>Selecciona préstamo</option>
        <option *ngFor="let opt of prestamos" [value]="opt.id">#{{ opt.id }} - {{ opt.fechaPrestamo }}</option>
      </select>
      <small class="ayuda">A qué préstamo pertenece este detalle</small>
    </div>
    <div class="campo">
      <label for="ejemplar">Ejemplar</label>
      <select id="ejemplar" [(ngModel)]="detallePrestamoActual.ejemplar.id" name="ejemplar">
        <option [value]="0" disabled>Selecciona ejemplar</option>
        <option *ngFor="let opt of ejemplares" [value]="opt.id">{{ opt.codigoBarra }}</option>
      </select>
      <small class="ayuda">Qué ejemplar físico se prestó</small>
    </div>

    <div class="acciones-form">
      <button type="submit">{{ editando ? 'Actualizar' : 'Guardar' }}</button>
      <button type="button" class="boton-secundario" (click)="cancelar()" *ngIf="editando">Cancelar</button>
    </div>
  </form>

  <table class="tabla">
    <thead>
      <tr>
        <th>Fecha de devolución</th><th>Estado</th><th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of detallePrestamos">
        <td>{{ item.fechaDevolucion }}</td><td>{{ item.estado }}</td>
        <td>
          <button (click)="editar(item)">Editar</button>
          <button class="boton-peligro" (click)="eliminar(item.id)">Eliminar</button>

        </td>
      </tr>
    </tbody>
  </table>
</div>
