<div class="login-page">
  <form class="login-card" (ngSubmit)="onSubmit()">
    <h1>Sistema de Biblioteca</h1>
    <p class="subtitulo">Ingresa tus credenciales para continuar</p>

    <label for="username">Usuario</label>
    <input id="username" name="username" type="text" [(ngModel)]="username" autocomplete="username" />

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" [(ngModel)]="password" autocomplete="current-password" />

    <p class="error" *ngIf="error">{{ error }}</p>

    <button type="submit" [disabled]="cargando">
      {{ cargando ? 'Ingresando...' : 'Ingresar' }}
    </button>

    <p class="ayuda">Usuario de prueba: <b>admin</b> / <b>admin123</b></p>
  </form>
</div>
